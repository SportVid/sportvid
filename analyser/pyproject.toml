[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyser"
version = "0.1.0"
description = "analyser package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "interface",
    "inference_ray",
    "utils",
    "data",
    "grpcio>=1.70.0",
    # "grpcio-tools==1.70",
    "imageio>=2.37.0",
    "msgpack>=1.1.0",
    "packaging>=24.2",
    "protobuf>=5.29.3",
    "ray[serve]==2.42.0",
    "requests>=2.32.3",
    "tqdm>=4.67.1",
    "valkey>=6.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.distutils.egg_info]
egg_base = "build"

[tool.uv]
package = true

[tool.uv.sources]
interface = { workspace = true }
data = { workspace = true }
inference_ray = { workspace = true }
utils = { workspace = true }