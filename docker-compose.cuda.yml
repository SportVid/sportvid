secrets:
  django_settings:
    file: ${SPORTVID_BACKEND_CONFIG}

# volumes:
#   assets:
#     name: frontend-assets
services:
  inference_ray:
    container_name: inference_ray
    build:
      context: .
      dockerfile: inference_ray/Dockerfile.cuda
    init: true
    ports:
      - "127.0.0.1:8265:8265"
    shm_size: "4g" # NOTE: should be 30% of available system memory.
    environment:
      - HF_HOME=/models
      - NUMBA_CACHE_DIR=/tmp
      - NVIDIA_VISIBLE_DEVICES=all
    env_file:
      - ./.env
    volumes:
      - ${DATA_PATH}/analyser:/data/
      - ${DATA_PATH}/media/:/media/
      - ${DATA_PATH}/models/:/models/
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    working_dir: /app/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    command: >
      bash -c "
      uv run --package inference_ray ray start --head --dashboard-host=0.0.0.0 --dashboard-port=8265 &&
      uv run --package inference_ray serve run /app/inference_ray/deploy.cuda.yml
      "

  analyser:
    container_name: analyser
    build:
      context: .
    env_file:
      - ./.env
    volumes:
      - ${DATA_PATH}/analyser:/data/
      - ${DATA_PATH}/media/:/media/
      - ${DATA_PATH}/models/:/models/
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    working_dir: /app/
    command: uv run --package analyser analyser/src/analyser/server.py -v -c analyser/config.yml

  memcached:
    container_name: memcached
    image: memcached:1.6.10-buster
    command: -I 32m

  valkey:
    container_name: valkey
    image: valkey/valkey:8.1.1-alpine
    env_file:
      - ./.env
    command:
      - "/usr/local/bin/valkey-server"
      - "--bind"
      - "${VALKEY_INTERNAL_HOST}"
      - "--port"
      - "${VALKEY_INTERNAL_PORT}"
      # - "--requirepass"
      # - "${VALKEY_PASSWD}"
      # - "--protected-mode"
      # - "yes"
    ports:
      - ${VALKEY_INTERNAL_PORT}:${VALKEY_INTERNAL_PORT} # remap port
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -h 127.0.0.1 -p ${VALKEY_INTERNAL_PORT} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    container_name: postgres
    image: postgres:14.17
    env_file:
      - ./.env
    volumes:
      - ${DATA_PATH}/shared/db/:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d  # init.sh is invoked automatically
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  celery:
    container_name: celery
    build:
      context: .
    env_file:
      - ./.env
    secrets:
      - django_settings
    volumes:
      - ${DATA_PATH}/media/:/media
      - ${DATA_PATH}/predictions:/predictions
      - ${DATA_PATH}/backend_cache:/cache
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./backend/:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    tmpfs:
      - /tmp
      - /var
    working_dir: /app/backend/src/backend/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    command:
      - "uv"
      - "run"
      - "--package"
      - "backend"
      - "celery"
      - "-A"
      - "sportvid"
      - "worker"
      - "--loglevel"
      - "${LOG_LEVEL:-DEBUG}"

  backend:
    container_name: backend
    build:
      context: .
      args:
        - BACKEND_PORT=${BACKEND_PORT}
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    secrets:
      - django_settings
    environment:
      - PYTHONPATH=/app/backend/:/app:/app/analyser:/app/backend/src/backend/
    env_file:
      - ./.env
    volumes:
      - ${DATA_PATH}/media/:/media
      - ${DATA_PATH}/predictions:/predictions
      - ${DATA_PATH}/backend_cache:/cache
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./backend/:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    tmpfs:
      - /tmp
      - /var/tmp
    working_dir: /app/
    command:
      - "uv"
      - "run"
      - "--package"
      - "backend"
      - "gunicorn"
      - "--bind"
      - "0.0.0.0:${BACKEND_PORT}"
      - "--env"
      - "SCRIPT_NAME=/api"
      - "sportvid.wsgi"
      - "--capture-output"
      - "--log-level"
      - "${LOG_LEVEL:-DEBUG}"
      - "--timeout"
      - "1800"
      - "--workers"
      - "${GUNICORN_WORKERS:-4}"
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
      celery:
        condition: service_started
    # healthcheck:
    #   test: ["CMD-SHELL", "curl --fail http://localhost:${BACKEND_PORT}/api/readyz/ || exit 1"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 90s

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - 8080:8080
      - 80:80
    volumes:
      - ./frontend/:/app/frontend
      - ${DATA_PATH}/predictions/:/thumbnails
      - ${DATA_PATH}/media/:/media
      # - assets:/assets
    working_dir: /app/frontend
    depends_on:
      backend:
        condition: service_started