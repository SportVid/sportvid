networks:
  shared:
    external: true
  dev:
    driver: bridge

secrets:
  django_settings:
    file: ${SPORTVID_BACKEND_CONFIG}

volumes:
  assets:
    external: true
    name: frontend-assets

services:
  inference_ray:
    container_name: inference_ray_dev
    user: "${UID}:${GID}"
    image: sportvid_dev-inference_ray:latest
    build:
      context: .
      dockerfile: inference_ray/Dockerfile
    init: true
    ports:
      - "127.0.0.1:8265:8265"
    shm_size: "8g" # NOTE: should be 30% of total available memory?
    environment:
      - HF_HOME=/models
      - NUMBA_CACHE_DIR=/tmp
      - NVIDIA_VISIBLE_DEVICES=all
    env_file:
      - /opt/deploy/.env.dev
    volumes:
      - ${DATA_PATH}/analyser:/data/
      - ${DATA_PATH}/media/:/media/
      - ${DATA_PATH}/models/:/models/
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    working_dir: /app/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"] #TODO: prod uses ["0", "1", "2"]; change to all 4 later on production.
              capabilities: [gpu]
    command: >
      bash -c "
      uv run --package inference_ray ray start --head --dashboard-host=0.0.0.0 --dashboard-port=8265 &&
      uv run --package inference_ray serve run /app/inference_ray/deploy.cuda.yml
      "
    networks:
      - dev

  analyser:
    container_name: analyser_dev
    user: "${UID}:${GID}"
    image: sportvid_dev-analyser:latest
    build:
      context: .
      # dockerfile: analyser/Dockerfile
    env_file:
      - /opt/deploy/.env.dev
    volumes:
      - ${DATA_PATH}/analyser:/data/
      - ${DATA_PATH}/media/:/media/
      - ${DATA_PATH}/cache/:/cache/
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    working_dir: /app/
    command: uv run --package analyser analyser/src/analyser/server.py -v -c analyser/config.yml
    networks:
      - dev

  memcached:
    container_name: memcached_dev
    image: memcached:1.6.10-buster
    command: -I 32m
    networks:
      - dev

  valkey:
    container_name: valkey_dev
    image: valkey/valkey:8.1.1-alpine
    env_file: 
      - /opt/deploy/.env.dev
    command:
      - "/usr/local/bin/valkey-server"
      - "--bind"
      - "${VALKEY_INTERNAL_HOST}"
      - "--port"
      - "${VALKEY_INTERNAL_PORT}"
      - "--requirepass"
      - "${VALKEY_PASSWD}"
      - "--protected-mode"
      - "yes"
    ports:
      - ${VALKEY_INTERNAL_PORT}:${VALKEY_INTERNAL_PORT} # remap port
    # TODO: not working, fix this...
    # healthcheck:
    #   test: ["CMD-SHELL", "valkey-cli -h 127.0.0.1 -p ${VALKEY_INTERNAL_PORT} -a ${VALKEY_PASSWORD} ping | grep PONG"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 10s
    networks:
      - dev

  celery:
    container_name: celery_dev
    user: "${UID}:${GID}"
    image: sportvid_dev-celery:latest
    build:
      context: .
    env_file:
      - /opt/deploy/.env.dev
    secrets:
      - django_settings
    volumes:
      - ${DATA_PATH}/media/:/media
      - ${DATA_PATH}/predictions:/predictions
      - ${DATA_PATH}/backend_cache:/cache
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./backend/:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    depends_on:
      # TODO: This doesn't work since it is not defined in the same compose file.
      #       Need to integrate this into the CI pipeline somehow...!
      # postgres:
      #   condition: service_healthy
      valkey:
        condition: service_started
    tmpfs:
      - /tmp
      - /var/tmp
    working_dir: /app/backend/src/backend/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"] #TODO: prod uses ["0", "1", "2"]; change to all 4 later on production.
              capabilities: [gpu]
    command:
      - "uv"
      - "run"
      - "--no-editable"
      - "--package"
      - "backend"
      - "celery"
      - "-A"
      - "sportvid.celery:app"
      - "worker"
      - "--hostname=gpu@%h"
      - "--queues=gpu"
      - "--pool=threads"
      - "--concurrency=4"
      - "--prefetch-multiplier=1"
      - "--loglevel"
      - "${LOG_LEVEL:-DEBUG}"
      - "--concurrency=16"
      - "--pool=threads"
      - "--prefetch-multiplier=1"
    networks:
      - shared
      - dev

  backend:
    container_name: backend_dev
    user: "${UID}:${GID}"
    image: sportvid_dev-backend:latest
    build:
      context: .
      args:
        - BACKEND_PORT=${BACKEND_PORT}
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    secrets:
      - django_settings
    environment:
      - PYTHONPATH=/app/backend/:/app:/app/analyser:/app/backend/src/backend/
    env_file:
      - /opt/deploy/.env.dev
    volumes:
      - ${DATA_PATH}/media/:/media
      - ${DATA_PATH}/predictions:/predictions
      - ${DATA_PATH}/backend_cache:/cache
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./backend/:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    tmpfs:
      - /tmp
      - /var/tmp
    working_dir: /app/
    command:
      - "uv"
      - "run"
      - "--no-editable"
      - "--package"
      - "backend"
      - "gunicorn"
      - "--bind"
      - "0.0.0.0:${BACKEND_PORT}"
      - "--env"
      - "SCRIPT_NAME=/api"
      - "sportvid.wsgi"
      - "--capture-output"
      - "--log-level"
      - "${LOG_LEVEL:-DEBUG}"
      - "--timeout"
      - "${GUNICORN_TIMEOUT:-1800}"
      - "--workers"
      - "${GUNICORN_WORKERS:-4}"
      # SSE requires threaded workers so /events/stream does not occupy a whole worker per connection.
      - "--worker-class"
      - "gthread"
      - "--threads"
      - "${GUNICORN_THREADS:-16}"
    depends_on:
      # postgres:
      #   condition: service_healthy
      memcached:
        condition: service_started
      celery-io:
        condition: service_started
      celery-gpu:
        condition: service_started
    networks:
      - shared
      - dev

  frontend:
    container_name: frontend_dev
    image: sportvid_dev-frontend:latest
    build:
      context: ./frontend
    volumes:
      # - ./frontend/:/app/frontend
      # - ${DATA_PATH}/predictions/:/thumbnails
      # - ${DATA_PATH}/media/:/media
      - assets:/assets
    command: >
      sh -c 'mkdir -p /assets/dev &&
        rm -rf /assets/dev/* &&
        cp -a dist/. /assets/dev/'
    networks:
      - shared
      - dev
    depends_on:
      backend:
        condition: service_started