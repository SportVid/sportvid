secrets:
  django_settings:
    file: ${SPORTVID_BACKEND_CONFIG}

volumes:
  assets:
    external: true
    name: frontend-assets
services:
  inference_ray:
    build:
      context: .
    init: true
    shm_size: "2g" # TODO: should be 30% of total available memory?
    environment:
      - HF_HOME=/models
      - NUMBA_CACHE_DIR=/tmp
      # - NVIDIA_VISIBLE_DEVICES=all
    env_file:
      - .env.dev
    volumes:
      - ${DATA_PATH}/analyser:/data/
      - ${DATA_PATH}/media/:/media/
      - ${DATA_PATH}/models/:/models/
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [ gpu ]
    working_dir: /app/
    command:
      - "uv"
      - "run"
      - "--package"
      - "inference_ray"
      - "serve"
      - "run"
      - "/app/inference_ray/deploy.cuda.yml"

  analyser:
    image: ghcr.io/astral-sh/uv:debian
    volumes:
      - ${DATA_PATH}/analyser:/data/
      - ${DATA_PATH}/media/:/media/
      - ${DATA_PATH}/models/:/models/
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    working_dir: /app/
    command: uv run --package analyser analyser/src/analyser/server.py -v -c analyser/config.yml

  memcached:
    image: memcached:1.6.10-buster
    command: -I 32m

  valkey:
    image: valkey/valkey:8.1.1-alpine
    env_file: 
      - .env.dev
    command:
      - "/usr/local/bin/valkey-server"
      - "--bind"
      - "${VALKEY_INTERNAL_HOST}"
      - "--port"
      - "${VALKEY_INTERNAL_PORT}"
      # - "--requirepass"
      # - "${VALKEY_PASSWD}"
      # - "--protected-mode"
      # - "yes"
    ports:
      - ${VALKEY_INTERNAL_PORT}:${VALKEY_INTERNAL_PORT} # remap port

  postgres:
    image: postgres:14.17
    volumes:
      - ${DATA_PATH}/shared/db/:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d  # init.sh is invoked automatically
    env_file:
      - .env.dev

  celery:
    build:
      context: .
    env_file:
      - /opt/deploy/.env.dev
    volumes:
      - ${DATA_PATH}/media/:/media
      - ${DATA_PATH}/predictions:/predictions
      - ${DATA_PATH}/backend_cache:/cache
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./backend/:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    tmpfs:
      - /tmp
      - /var
    working_dir: /app/backend/src/backend/
    environment:
      - SPORTVID_BACKEND_CONFIG=/app/backend/config.json
    command:
      - "uv"
      - "run"
      - "--package"
      - "backend"
      - "celery"
      - "-A"
      - "sportvid"
      - "worker"
      - "${LOG_LEVEL}"
      - "INFO"

  backend:
    build:
      context: .
      args:
        - BACKEND_PORT=${BACKEND_PORT}
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    secrets:
      - django_settings
    environment:
      - PYTHONPATH=/app/backend/:/app:/app/analyser:/app/backend/src/backend/
    env_file:
      - .env.dev
    volumes:
      - ${DATA_PATH}/media/:/media
      - ${DATA_PATH}/predictions:/predictions
      - ${DATA_PATH}/backend_cache:/cache
      - ./inference_ray:/app/inference_ray
      - ./analyser:/app/analyser
      - ./packages:/app/packages
      - ./backend/:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./.python-version:/app/.python-version
    tmpfs:
      - /tmp
      - /var/tmp
    working_dir: /app/
    command:
      - "uv"
      - "run"
      - "--package"
      - "backend"
      - "gunicorn"
      - "--bind"
      - "0.0.0.0:${BACKEND_PORT}"
      - "--env"
      - "SCRIPT_NAME=/api"
      - "sportvid.wsgi"
      - "--capture-output"
      - "--log-level"
      - "${LOG_LEVEL}"
      - "--timeout"
      - "1800"
      - "--workers"
      - "${GUNICORN_WORKERS}"
    # command: uv run --package backend python3 backend/src/backend/manage.py runserver 0.0.0.0:8000
    depends_on:
      # NOTE: could use a sleep script until PSQL is reachable (see /postgres/wait.sh)
      # postgres:
      #   condition: service_healthy
      memcached:
        condition: service_started
      celery:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - 8080:8080
      - 80:80
    volumes:
      - ./frontend/:/app/frontend
      - ${DATA_PATH}/predictions/:/thumbnails
      - ${DATA_PATH}/media/:/media
      - assets:/assets
    env_file:
      - .env.dev
    working_dir: /app/frontend