proxy_location: EveryNode
http_options:
  host: 0.0.0.0
  port: 8010
logging_config:
  encoding: TEXT # or JSON
  log_level: INFO # DEBUG, INFO, WARNING, ERROR, CRITICAL
  logs_dir: null # or a custom path; null = default
  enable_access_log: false

applications:
  # ---------- NEW INTEGRATION (GPU required)
  - name: team_clustering
    route_prefix: /team_clustering
    import_path: inference_ray.main:app_builder
    args:
      model: team_clustering
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 4.0

  - name: osnet_reid
    route_prefix: /osnet_reid
    import_path: inference_ray.main:app_builder
    args:
      model: osnet_reid
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          # num_cpus: 1.0
          num_gpus: 0.5

  - name: object_tracker
    route_prefix: /object_tracker
    import_path: inference_ray.main:app_builder
    args:
      model: object_tracker
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          # num_cpus: 1.0
          num_gpus: 0.5
        runtime_env:
          env_vars:
            PYTHONPATH: "/app:/app/inference_ray/third_party/ByteTrack"

  # ---------- AUDIO / TRANSCRIPT (whisper, GPU optional)
  - name: video_to_audio
    route_prefix: /video_to_audio
    import_path: inference_ray.main:app_builder
    args:
      model: video_to_audio
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0

  - name: whisper
    route_prefix: /whisper
    import_path: inference_ray.main:app_builder
    args:
      model: whisper
      data_path: /data
      # whisper-base hallucinates badly on non-studio audio (crowd noise, a whistle, a shout
      # from far off mic) -- whisper-medium is a large quality step up for that, and with a
      # GPU available here the extra cost is easily worth it. Bump to large-v3 for even
      # better quality if the runtime is still acceptable.
      params:
        model: openai/whisper-medium
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          # num_cpus: 1.0
          num_gpus: 0.5

  # ---------- CRITICAL (GPU required)
  - name: bytetrack
    route_prefix: /bytetrack
    import_path: inference_ray.main:app_builder
    args:
      model: bytetrack
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.5
        runtime_env:
          env_vars:
            PYTHONPATH: "/app:/app/inference_ray/third_party/ByteTrack"

  # ---------- LOW (CPU only)
  - name: calibration_static_dlt
    route_prefix: /calibration_static_dlt
    import_path: inference_ray.main:app_builder
    args:
      model: calibration_static_dlt
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0

  - name: kpi_computation
    route_prefix: /kpi_computation
    import_path: inference_ray.main:app_builder
    args:
      model: kpi_computation
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0
        runtime_env:
          uv:
            - pandas

  - name: floodlight_convert
    route_prefix: /floodlight_convert
    import_path: inference_ray.main:app_builder
    args:
      model: floodlight_convert
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0
        runtime_env:
          uv:
            - pandas

  - name: posdata_convert
    route_prefix: /posdata_convert
    import_path: inference_ray.main:app_builder
    args:
      model: posdata_convert
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0
        runtime_env:
          uv:
            - pandas
            - lxml

  - name: thumbnail_generator
    route_prefix: /thumbnail_generator
    import_path: inference_ray.main:app_builder
    args:
      model: thumbnail_generator
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0
