proxy_location: EveryNode
http_options:
  host: 0.0.0.0
  port: 8010
logging_config:
  encoding: TEXT # or JSON
  log_level: INFO # DEBUG, INFO, WARNING, ERROR, CRITICAL
  logs_dir: null # or a custom path; null = default
  enable_access_log: false

applications:
  # ---------- CRITICAL (GPU required)
  - name: bytetrack
    route_prefix: /bytetrack
    import_path: inference_ray.main:app_builder
    args:
      model: bytetrack
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.5
        runtime_env:
            env_vars:
              PYTHONPATH: "/app:/app/inference_ray/third_party/ByteTrack"
            # uv:
            #   - numpy==1.26.4
            #   - opencv-python-headless==4.11.0.86
            #   - loguru
            #   - scikit-image
            #   - tqdm
            #   - Pillow
            #   - thop
            #   - ninja
            #   - tabulate
            #   - tensorboard
            #   - lap
            #   - motmetrics
            #   - filterpy
            #   - h5py
            #   - cython
            #   - cython-bbox
            #   - pycocotools
            #   - gdown
            #   - ray[serve]
            #   - onnx==1.13.0
            #   - onnxruntime==1.13.1
            #   - onnx-simplifier==0.3.5
  
  # ---------- LOW (CPU only)
  - name: calibration_static_dlt
    route_prefix: /calibration_static_dlt
    import_path: inference_ray.main:app_builder
    args:
      model: calibration_static_dlt
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0
        runtime_env:
          uv:
            - numpy==2.2.4
            - opencv-python-headless==4.11.0.86

  - name: kpi_computation
    route_prefix: /kpi_computation
    import_path: inference_ray.main:app_builder
    args:
      model: kpi_computation
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0
        runtime_env:
          uv:
            - pandas
            - floodlight==1.1.0

  - name: floodlight_convert
    route_prefix: /floodlight_convert
    import_path: inference_ray.main:app_builder
    args:
      model: floodlight_convert
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0
        runtime_env:
          uv:
            - pandas
            - floodlight==1.0.0
  
  - name: posdata_convert
    route_prefix: /posdata_convert
    import_path: inference_ray.main:app_builder
    args:
      model: posdata_convert
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        num_replicas: auto
        autoscaling_config:
          max_ongoing_requests: 2
          initial_replicas: 0
          min_replicas: 0
          max_replicas: 1
        ray_actor_options:
          num_cpus: 1.0
          num_gpus: 0.0
        runtime_env:
          uv:
            - pandas
            - lxml