proxy_location: EveryNode
http_options:
  host: 0.0.0.0
  port: 8000
logging_config:
  encoding: TEXT # or JSON
  log_level: INFO # DEBUG, INFO, WARNING, ERROR, CRITICAL
  logs_dir: null # or a custom path; null = default
  enable_access_log: false

applications:
  # ---------- CRITICAL (GPU required)
  - name: bytetrack
    route_prefix: /bytetrack
    import_path: inference_ray.main:app_builder
    args:
      model: bytetrack
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        max_ongoing_requests: 2 # 2 or 4 seems to be a reasonable upper bound for now
        autoscaling_config:
          min_replicas: 0
          initial_replicas: 0
          max_replicas: 1
          target_num_ongoing_requests_per_replica: 4
          metrics_interval_s: 5
          look_back_period_s: 15
          upscale_delay_s: 5
          downscale_delay_s: 30
        ray_actor_options:
          num_gpus: 1
          runtime_env:
            uv:
              - git+https://github.com/Alexk1704/ByteTrack.git
              - torch>=2.6.0
              - numpy==1.26.4
              - opencv-python-headless>=4.11.0.86
              - loguru
              - scikit-image
              - tqdm
              - torchvision>=0.10.0
              - Pillow
              - thop
              - ninja
              - tabulate
              - tensorboard
              - lap
              - motmetrics
              - filterpy
              - h5py
              - cython_bbox
              - gdown
              - pycocotools
              # - onnx==1.13.0
              # - onnxruntime==1.13.1
              # - onnx-simplifier==0.3.5
  
  # ---------- LOW (CPU only)
  - name: calibration_static_dlt
    route_prefix: /calibration_static_dlt
    import_path: inference_ray.main:app_builder
    args:
      model: calibration_static_dlt
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        max_ongoing_requests: 2
        autoscaling_config:
          min_replicas: 0
          initial_replicas: 0
          max_replicas: 1
          target_num_ongoing_requests_per_replica: 4
          metrics_interval_s: 5
          look_back_period_s: 15
          upscale_delay_s: 5
          downscale_delay_s: 30
        ray_actor_options:
          num_cpus: 2
          runtime_env:
            uv:
              - numpy==2.2.4
              - opencv-python-headless==4.11.0.86
  
  - name: floodlight_convert
    route_prefix: /floodlight_convert
    import_path: inference_ray.main:app_builder
    args:
      model: floodlight_convert
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        max_ongoing_requests: 2
        autoscaling_config:
          min_replicas: 0
          initial_replicas: 0
          max_replicas: 1
          target_num_ongoing_requests_per_replica: 4
          metrics_interval_s: 5
          look_back_period_s: 15
          upscale_delay_s: 5
          downscale_delay_s: 30
        ray_actor_options:
          num_cpus: 4
          runtime_env:
            uv:
              - numpy
              - pandas
              - floodlight==1.0.0
  
  - name: posdata_convert
    route_prefix: /posdata_convert
    import_path: inference_ray.main:app_builder
    args:
      model: posdata_convert
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        max_ongoing_requests: 2
        autoscaling_config:
          min_replicas: 0
          initial_replicas: 0
          max_replicas: 1
          target_num_ongoing_requests_per_replica: 4
          metrics_interval_s: 5
          look_back_period_s: 15
          upscale_delay_s: 5
          downscale_delay_s: 30
        ray_actor_options:
          num_cpus: 4
          runtime_env:
            uv:
              - numpy
              - pandas
              - lxml

  - name: kpi_computation
    route_prefix: /kpi_computation
    import_path: inference_ray.main:app_builder
    args:
      model: kpi_computation
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        max_ongoing_requests: 4
        autoscaling_config:
          min_replicas: 0
          initial_replicas: 0
          max_replicas: 4
          target_num_ongoing_requests_per_replica: 2
          metrics_interval_s: 10
          look_back_period_s: 30
          upscale_delay_s: 15
          downscale_delay_s: 60
        ray_actor_options:
          num_cpus: 4
          runtime_env:
            uv:
              - numpy
              - pandas
              - floodlight==1.1.0

  - name: thumbnail_generator
    route_prefix: /thumbnail_generator
    import_path: inference_ray.main:app_builder
    args:
      model: thumbnail_generator
      data_path: /data
      params: {}
    deployments:
      - name: Deployment
        max_ongoing_requests: 2
        autoscaling_config:
          min_replicas: 0
          initial_replicas: 0
          max_replicas: 1
          target_num_ongoing_requests_per_replica: 4
          metrics_interval_s: 5
          look_back_period_s: 15
          upscale_delay_s: 5
          downscale_delay_s: 30
        ray_actor_options:
          num_cpus: 2