name: deploy_prod

on:
  push:
    branches:
      - deploy-prod

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Debug Node
        run: |
          echo "PATH=$PATH"
          which node || true
          node --version || true
          npm --version || true

      - name: Restart prod systemd service
        run: |
          systemctl restart sportvid_prod
