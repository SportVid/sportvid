# -------- DEFAULT
server { # sets up a default server to return “444 No Response” on an unrecognized host
    listen 80 default_server;
    
    server_name _;
    return 444;
}

server { # same for HTTPS, use dummy SSL certs for the default server
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/cert/dummy.crt;
    ssl_certificate_key /etc/cert/dummy.key;
    
    return 444;
}