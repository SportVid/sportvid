# -------- PROD
# upstream sportvid_backend_prod_gunicorn {
#     server backend_prod:8000 fail_timeout=0;  # using docker service name here
# }

server {
    listen 80;
    server_name sportvid.dshs-koeln.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen          443 ssl;
    server_name     sportvid.dshs-koeln.de;
    # http2           on;

    resolver 127.0.0.11 valid=10s;

    ssl_certificate     /etc/cert/cert_bundle.pem;
    ssl_certificate_key /etc/cert/private_key;
    ssl_password_file   /etc/cert/password.txt;

    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;
    # ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    
    root                    /var/www/html/prod;

    client_max_body_size    4G; # is this a reasonable limit?
    client_body_timeout     3600s;
    
    keepalive_timeout       65;
    
    location /thumbnails/ { 
        alias /prod/thumbnails/; 
    }
    location /media/ { 
        alias /prod/media/; 
    }

    # location /css/ { alias /usr/share/nginx/html/prod/css/; }
    # location /js/ { alias /usr/share/nginx/html/prod/js/; }
    # location /fonts/ { alias /usr/share/nginx/html/prod/fonts/; }
    # location /img/ { alias /usr/share/nginx/html/prod/img/; }

    location ~ /\. {  # deny access to hidden files like .htaccess
        deny all;
    }
    
    location / {  # frontend fallback for SPA
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend_host http://backend_prod:8000;
        proxy_pass $backend_host$request_uri;

        # access control via htpasswd
        auth_basic "Restricted Site";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # proxy_pass http://backend_prod:8000/api/;

        # via upstream & docker service name
        # proxy_pass http://sportvid_backend_prod_gunicorn/api/;

        # proxy_redirect off;

        # ---- UPLOAD settings
        # Disable buffering to stream directly to backend
        proxy_request_buffering off;
        
        # Set long timeouts for large file transfers (1 hour)
        proxy_connect_timeout   300s;
        proxy_send_timeout      3600s;
        proxy_read_timeout      3600s;

        # Required for streaming/unbuffered requests
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        # ----
    
        # proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

