[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interface"
version = "0.1.0"
description = "interface package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["grpcio==1.71.0", "protobuf>=5.29.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true