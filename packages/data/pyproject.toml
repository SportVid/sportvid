[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data"
version = "0.1.0"
description = "data package"
readme = "README.md"
authors = [
    { name = "matthias springstein", email = "matthias.springstein@gmail.com" },
]
requires-python = ">=3.10"
dependencies = ["interface", "utils"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
interface = { workspace = true }
utils = { workspace = true }